name: Build Punta Cavaliero APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q PuntaCavaliero_Android_V3_TOURNAMENT_LOGO_FIX.zip -d android-project
      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk Punta-Cavaliero.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Punta-Cavaliero-APK
          path: Punta-Cavaliero.apk
          retention-days: 30
